<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>阳光庭院 · 游戏设计资产</title>
  <style>
    :root{color-scheme:light;--paper:#f5f2de;--card:#fffef5;--ink:#293e27;--muted:#718063;--line:#dce3c7;--leaf:#588043}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:1320px;margin:auto;padding:50px 46px 40px}
    header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px;padding-bottom:24px;border-bottom:1px solid #cbd5ad}
    .eyebrow{font-size:12px;font-weight:650;letter-spacing:.2em;color:var(--leaf);margin:0 0 10px}
    h1{font-size:38px;line-height:1.2;letter-spacing:.04em;margin:0;font-weight:750}
    header p:last-child{color:var(--muted);font-size:14px;line-height:1.8;margin:0;text-align:right}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    figure{margin:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 4px 18px #4b662707}
    a{display:block;color:inherit;text-decoration:none}
    a:focus-visible{outline:3px solid var(--leaf);outline-offset:-5px;border-radius:24px}
    .art{height:294px;padding:20px 22px 8px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#eff3d9 0,#f9f9eb 53%,#fffef5 80%)}
    img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .18s ease}
    a:hover img{transform:translateY(-3px)}
    figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 24px 20px;border-top:1px solid #e9ecd9}
    .name{font-size:22px;font-weight:700;letter-spacing:.08em}
    .type{font-size:12px;color:var(--muted)}
    footer{margin-top:24px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:16px}
    @media(max-width:760px){main{padding:30px 22px}header{display:block}h1{font-size:29px}header p:last-child{text-align:left;margin-top:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.art{height:230px;padding:15px}.name{font-size:18px}figcaption{padding:12px 15px 16px;display:block}.type{display:block;margin-top:5px}footer{display:block;line-height:1.8}}
    @media(max-width:460px){.grid{grid-template-columns:1fr}.art{height:300px}header{margin-bottom:22px}}
    @media(prefers-reduced-motion:reduce){img{transition:none}a:hover img{transform:none}}
  </style>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">SUNLIT GARDEN / DESIGN ASSETS</p><h1>阳光庭院 · 设计资产</h1></div>
    <p>七种植物，与庭院里的工具<br>统一 3D 手绘质感 · 单体透明 PNG</p>
  </header>
  <section class="grid" aria-label="九张游戏设计资产">
    <figure><a href="sunflower-design-v1.png" target="_blank"><div class="art"><img src="sunflower-design-v1.png" alt="金黄花瓣、四片绿叶的向日葵"></div><figcaption><span class="name">向日葵</span><span class="type">阳光生产</span></figcaption></a></figure>
    <figure><a href="peashooter-design-v2.png" target="_blank"><div class="art"><img src="peashooter-design-v2.png" alt="朝右的绿色豌豆射手"></div><figcaption><span class="name">豌豆射手</span><span class="type">基础攻击</span></figcaption></a></figure>
    <figure><a href="wallnut-design-v1.png" target="_blank"><div class="art"><img src="wallnut-design-v1.png" alt="温暖棕色、憨厚表情的坚果"></div><figcaption><span class="name">坚果</span><span class="type">防御阻挡</span></figcaption></a></figure>
    <figure><a href="snowpea-design-v1.png" target="_blank"><div class="art"><img src="snowpea-design-v1.png" alt="冰蓝色单炮口寒冰射手"></div><figcaption><span class="name">寒冰射手</span><span class="type">冰冻减速</span></figcaption></a></figure>
    <figure><a href="cherrybomb-design-v1.png" target="_blank"><div class="art"><img src="cherrybomb-design-v1.png" alt="成对的红色樱桃炸弹"></div><figcaption><span class="name">樱桃炸弹</span><span class="type">范围爆破</span></figcaption></a></figure>
    <figure><a href="repeater-design-v1.png" target="_blank"><div class="art"><img src="repeater-design-v1.png" alt="双炮口绿色双发射手"></div><figcaption><span class="name">双发射手</span><span class="type">双发攻击</span></figcaption></a></figure>
    <figure><a href="potatomine-design-v1.png" target="_blank"><div class="art"><img src="potatomine-design-v1.png" alt="带有引爆装置的土豆地雷"></div><figcaption><span class="name">土豆地雷</span><span class="type">埋伏防守</span></figcaption></a></figure>
    <figure><a href="mower-design-v1.png" target="_blank"><div class="art"><img src="mower-design-v1.png" alt="红色庭院小推车割草机"></div><figcaption><span class="name">庭院小推车</span><span class="type">割草机</span></figcaption></a></figure>
    <figure><a href="shovel-design-v1.png" target="_blank"><div class="art"><img src="shovel-design-v1.png" alt="木柄金属庭院铲子"></div><figcaption><span class="name">铲子</span><span class="type">移除工具</span></figcaption></a></figure>
  </section>
  <footer><span>点击任一设计图查看独立原图</span><span>静态设计资产 · 2026.10.18</span></footer>
</main>
</body>
</html>
