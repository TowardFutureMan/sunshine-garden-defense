<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豌豆射手 · 8帧待机预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2df;color:#294329;font-family:system-ui,"PingFang SC",sans-serif}main{max-width:1080px;margin:36px auto;padding:0 24px}h1{font-size:30px;margin:8px 0}p{line-height:1.7;color:#64755b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{border:1px solid #dce3bc;background:#fffef3;border-radius:20px;padding:24px}canvas{display:block;width:100%;height:auto;background:linear-gradient(45deg,#edf1d7 25%,transparent 25%,transparent 75%,#edf1d7 75%),linear-gradient(45deg,#edf1d7 25%,#f8faec 25%,#f8faec 75%,#edf1d7 75%);background-position:0 0,12px 12px;background-size:24px 24px;border-radius:12px}img{width:100%;height:auto}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:8px;background:#426332;color:white;padding:10px 16px;font:inherit;cursor:pointer}a{color:#426332}label{display:flex;gap:6px;align-items:center}small{color:#718365}#counter{font-variant-numeric:tabular-nums}@media(max-width:700px){.grid{grid-template-columns:1fr}main{margin-top:24px}}
</style><main><small>PEASHOOTER / IDLE SWAY + BLINK / 8 FRAMES V3</small><h1>8 帧左右摆动与眨眼</h1><p>中间 → 左摆 → 回中眨眼 → 右摆 → 回中。直接切换8张源图，无交叉淡化、无额外程序化摆动。</p><div class="controls"><button id="play">暂停</button><button id="step">下一帧</button><label>播放速度 <input id="fps" type="range" min="4" max="20" step="1" value="7"><output id="rate">7 fps</output></label><label><input id="anchor" type="checkbox" checked>显示根部</label><span id="counter"></span><span id="pose-label"></span></div><div class="grid"><section class="panel"><h2>逐帧播放</h2><canvas id="view" width="900" height="780"></canvas><p>上方为放大检查，下方为接近游戏中的显示尺寸。</p><canvas id="small" width="900" height="250"></canvas></section><section class="panel"><h2>八帧透明图集</h2><a href="peashooter-sway-blink-8f-v3.png" target="_blank"><img src="peashooter-sway-blink-8f-v3.png" alt="4列2行豌豆射手八帧序列图"></a><p>实际导出：1774×887，4列×2行。按8个实际角色区域切帧，根部定位对齐。</p><a href="标准序列帧提示词.md">查看动作提示词与制作方法</a> · <a href="peashooter-sway-blink-8f-v3.json">切帧数据</a></section></div><p><a href="其他植物八帧序列图提示词.md">其他六种植物的完整提示词</a> · <a href="pose-guide-8f.png" target="_blank">查看8帧姿态参考图</a> · <a href="../peashooter-idle-v2/index.html">上一版16帧演示（保留）</a></p></main><script>
const atlas={"image": "peashooter-sway-blink-8f-v3.png", "width": 1774, "height": 887, "columns": 4, "rows": 2, "frames": [{"index": 0, "pose": "中间睁眼", "rect": [50, 20, 390, 424], "pivot": [196.0, 403], "visibleBounds": [19, 27, 376, 414]}, {"index": 1, "pose": "向左摆动", "rect": [460, 20, 425, 424], "pivot": [282.5, 405], "visibleBounds": [21, 40, 414, 416]}, {"index": 2, "pose": "左侧极限", "rect": [895, 20, 435, 424], "pivot": [293.0, 404], "visibleBounds": [11, 60, 423, 415]}, {"index": 3, "pose": "回中·半闭眼", "rect": [1355, 20, 400, 424], "pivot": [256.0, 405], "visibleBounds": [18, 42, 384, 416]}, {"index": 4, "pose": "中间·闭眼", "rect": [35, 460, 390, 415], "pivot": [212.5, 385], "visibleBounds": [14, 10, 371, 396]}, {"index": 5, "pose": "向右摆动·睁眼", "rect": [530, 460, 390, 415], "pivot": [156.0, 386], "visibleBounds": [17, 20, 346, 397]}, {"index": 6, "pose": "右侧极限", "rect": [965, 460, 425, 415], "pivot": [163.0, 386], "visibleBounds": [31, 18, 396, 397]}, {"index": 7, "pose": "回中", "rect": [1390, 460, 370, 415], "pivot": [197.0, 389], "visibleBounds": [26, 13, 350, 400]}], "renderScale": 0.19220779220779222, "playback": {"fps": 7, "mode": "hard-cut-no-crossfade", "durationSeconds": 1.1428571428571428}, "alphaExtrema": [0, 255], "note": "生成器未严格按等格排版；按8个实际角色区域裁切，避免跨格炮口漏入相邻帧。原PNG未编辑，预览只做统一比例与逐帧根部对位。"};let running=true,index=0,fps=7,elapsed=0,last=0;const img=new Image();img.src=atlas.image;
const view=document.getElementById('view'),small=document.getElementById('small'),counter=document.getElementById('counter');
function paint(canvas,zoom){const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);if(!img.complete||!img.naturalWidth)return;const f=atlas.frames[index],s=atlas.renderScale*zoom,x=canvas.width/2,y=canvas.height*.85;c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(img,...f.rect,x-f.pivot[0]*s,y-f.pivot[1]*s,f.rect[2]*s,f.rect[3]*s);if(document.getElementById('anchor').checked){c.strokeStyle='#db7548';c.lineWidth=2;c.beginPath();c.moveTo(x-10,y);c.lineTo(x+10,y);c.moveTo(x,y-10);c.lineTo(x,y+10);c.stroke();}}
function draw(){paint(view,7);paint(small,2);document.getElementById('pose-label').textContent=atlas.frames[index].pose;counter.textContent=`帧 ${String(index+1).padStart(2,'0')} / ${atlas.frames.length}`;}
function tick(now){if(last&&running){elapsed+=(now-last)/1000;index=Math.floor(elapsed*fps)%atlas.frames.length;}last=now;draw();requestAnimationFrame(tick);}img.onload=draw;requestAnimationFrame(tick);
document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'暂停':'播放';};document.getElementById('step').onclick=()=>{running=false;index=(index+1)%atlas.frames.length;elapsed=index/fps;document.getElementById('play').textContent='播放';draw();};document.getElementById('fps').oninput=e=>{fps=+e.target.value;elapsed=index/fps;document.getElementById('rate').textContent=fps+' fps';};window.sequencePreview={setFrame:i=>{running=false;index=i%atlas.frames.length;elapsed=index/fps;draw();},atlas};
</script></html>
